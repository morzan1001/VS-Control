name: Publish to VS Code Marketplace

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published release tag (for example 0.0.2)
        type: string
        required: true
      publish:
        description: Publish after verification (otherwise verify only)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: marketplace-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      filename: ${{ steps.release.outputs.filename }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify the published release against its source tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: python3 scripts/prepare-marketplace.py --tag "$RELEASE_TAG" --output "$RUNNER_TEMP/marketplace"
      - name: Validate the VSIX with the publishing tool
        env:
          VSIX_FILE: ${{ steps.release.outputs.filename }}
        run: >-
          npx --yes --package @vscode/vsce@4.1.1 -- vsce generate-manifest
          --packagePath "$RUNNER_TEMP/marketplace/$VSIX_FILE"
          --out "$RUNNER_TEMP/extension.manifest"
      - name: Retain the verified VSIX
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace/
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - name: Report verification mode
        if: vars.MARKETPLACE_PUBLISHING_ENABLED != 'true' || (github.event_name == 'workflow_dispatch' && !inputs.publish)
        run: echo 'VSIX verified. Publishing is disabled or this run is verification-only.' >> "$GITHUB_STEP_SUMMARY"

  publish:
    needs: verify
    if: vars.MARKETPLACE_PUBLISHING_ENABLED == 'true' && (github.event_name == 'release' || inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: marketplace-vsix
          path: ${{ runner.temp }}/marketplace
      - name: Recheck the transferred artifact
        working-directory: ${{ runner.temp }}/marketplace
        run: sha256sum --check verified.sha256
      - name: Publish the verified VSIX with Trusted Publishing
        env:
          VSIX_FILE: ${{ needs.verify.outputs.filename }}
        run: >-
          npx --yes --package @vscode/vsce@4.1.1 -- vsce publish --oidc
          --packagePath "$RUNNER_TEMP/marketplace/$VSIX_FILE"
