name: Tests

on:
  push:
    branches: [main]
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['20', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'
      - name: Check versions, syntax, and repository contents
        run: npm run check
      - name: Run unit, protocol, and transport tests
        run: npm test
      - name: Test Marketplace release verification
        run: npm run test:marketplace
      - name: Build portable packages
        run: npm run package
      - name: Verify checksums, reproducibility, and extracted MCP startup
        run: npm run verify:package
      - name: Check tracked files remain unchanged
        run: git diff --exit-code
      - name: Retain portable packages
        if: matrix.os == 'ubuntu-latest' && matrix.node == '24'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vs-control-${{ github.sha }}
          path: |
            dist/*.vsix
            dist/vs-control-plugin-*.zip
            dist/SHA256SUMS-*.txt
          if-no-files-found: error
          retention-days: 14
